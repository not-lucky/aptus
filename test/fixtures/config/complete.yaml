server:
  host: 0.0.0.0
  port: 8080
  bodyLimitBytes: 33554432
  maxInFlight: 1000
  requestDeadlineMs: 600000
  streamIdleMs: 60000
  shutdownDrainMs: 30000
  trustedProxyCidrs: []

operations:
  host: 127.0.0.1
  port: 9090

auth:
  clientKeys:
    - name: primary-client
      secret: ${APTUS_CLIENT_PRIMARY}
      allow: [gpt-main, claude-main, reliable-chat]
    - name: operator-client
      secret: ${APTUS_CLIENT_OPERATOR}
      # Omitted allow means all public names.

providers:
  - name: openai-chat-primary
    protocol: openai-chat
    baseUrl: https://api.openai.com/v1/
    headers:
      openai-organization: org_example
    keyStrategy: round-robin
    keys:
      - name: openai-chat-a
        secret: ${OPENAI_CHAT_KEY_A}
        enabled: true
      - name: openai-chat-b
        secret: ${OPENAI_CHAT_KEY_B}
        enabled: true

  - name: openai-responses-primary
    protocol: openai-responses
    baseUrl: https://api.openai.com/v1
    headers: {}
    keyStrategy: fill-first
    keys:
      - name: openai-responses-a
        secret: ${OPENAI_RESPONSES_KEY_A}
        enabled: true

  - name: anthropic-primary
    protocol: anthropic-messages
    baseUrl: https://api.anthropic.com
    headers:
      anthropic-version: "2023-06-01"
    keyStrategy: fill-first
    keys:
      - name: anthropic-a
        secret: ${ANTHROPIC_KEY_A}
        enabled: true

models:
  - name: gpt-main
    aliases: [chat-default]
    provider: openai-chat-primary
    upstreamModel: gpt-5.4
    defaults:
      temperature: 0.2
    extraBody: {}
    overrides:
      store: false
    catalog:
      openai:
        created: 1775606400
        ownedBy: openai
      anthropic:
        createdAt: "2026-04-08T00:00:00Z"
        displayName: GPT Main through Aptus
        capabilities:
          batch: null
          citations: null
          codeExecution: null
          imageInput: true
          pdfInput: null
          structuredOutput: true
          thinking: true
        maxInputTokens: null
        maxOutputTokens: null
    pricing:
      inputUsdPerMillionTokens: "2.50"
      outputUsdPerMillionTokens: "15.00"
      cacheReadUsdPerMillionTokens: "0.25"
      cacheWriteUsdPerMillionTokens: null

  - name: claude-main
    aliases: [messages-default]
    provider: anthropic-primary
    upstreamModel: claude-opus-4-1
    defaults:
      max_tokens: 4096
    extraBody: {}
    overrides: {}
    catalog:
      openai:
        created: 1754006400
        ownedBy: anthropic
      anthropic:
        createdAt: "2025-08-01T00:00:00Z"
        displayName: Claude Main
        capabilities: null
        maxInputTokens: null
        maxOutputTokens: null
    pricing: null

routes:
  - name: reliable-chat
    aliases: [production-chat]
    candidates: [gpt-main, claude-main]
    retryOn: [rate_limit, unavailable, provider]
    fallbackOn: [rate_limit, unavailable, provider, timeout]
    catalog:
      openai:
        created: 1775606400
        ownedBy: aptus
      anthropic:
        createdAt: "2026-04-08T00:00:00Z"
        displayName: Reliable Chat
        capabilities: null
        maxInputTokens: null
        maxOutputTokens: null

routing:
  keyPool:
    failureCooldownMs: [250, 1000]
    rateLimitFallbackMs: 1000
    maxRetryAfterMs: 30000
    jitterRatio: 0.25

tracing:
  enabled: true
  root: ./traces
  retention:
    maxAgeMs: 604800000
    maxBytes: 1073741824
    cleanupIntervalMs: 3600000

logging:
  enabled: true
  level: info

metrics:
  enabled: true

dryRun:
  enabled: false
